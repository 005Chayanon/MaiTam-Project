<!-- index.html -->
<html lang="en">
<head>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-inner">
      <header class="sidebar-header">
        <img src="logo.svg" />
        <button
          type="button"
          class="collapse-btn"
          id="collapseBtn"
        >
          <i data-lucide="panel-left"></i>
        </button>
      </header>

      <div class="search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search" />
        <span class="kbd"></span>
      </div>

      <ul class="nav">
        <li>
          <button type="button" class="active">
            <i data-lucide="house"></i>
            <span>Dashboard</span>
          </button>
        </li>
        <!-- more items -->
      </ul>

      <hr class="divider" />

      <ul class="nav apps">
        <li>
          <button type="button">
            <img src="framer.svg" />
            <span>Framer</span>
          </button>
        </li>
      </ul>

      <div class="theme-toggle">
        <i data-lucide="sun"></i>
        <button
          type="button"
          class="switch on"
          id="themeSwitch"
        >
          <span></span>
        </button>
        <i data-lucide="moon"></i>
      </div>
    </div>
  </aside>

  <script src="main.js"></script>
</body>
</html>
